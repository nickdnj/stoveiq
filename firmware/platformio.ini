; StoveIQ Open Source — PlatformIO Configuration
;
; Environments:
;   esp32s3  — Real ESP32-S3 hardware with MLX90640
;   emulator — Native desktop with thermal scene emulator
;
; SPDX-License-Identifier: MIT

[platformio]
default_envs = esp32s3

; ---------------------------------------------------------------------------
; Shared settings
; ---------------------------------------------------------------------------
[common]
build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
    -I include
    -I emulator
src_filter = +<src/*>

; ---------------------------------------------------------------------------
; ESP32-S3 target (real hardware)
; ---------------------------------------------------------------------------
[env:esp32s3]
; Pinned deliberately. Unpinned, CI resolves whatever espressif32 is newest at
; install time, and the ESP-IDF it bundles may not carry wifi_provisioning as a
; built-in component — src/CMakeLists.txt REQUIREs it, so the build fails at
; CMake configure time with "Failed to resolve component 'wifi_provisioning'".
; These two versions are the ones this firmware is known to build against
; (ESP-IDF 5.5.3). Bump them together, and re-run the build before committing.
platform = espressif32@6.13.0
platform_packages =
    platformio/framework-espidf@3.50503.0
board = esp32-s3-devkitc-1
framework = espidf
board_build.partitions = partitions.csv
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS=sdkconfig.defaults
build_flags =
    ${common.build_flags}
    -DCONFIG_STOVEIQ_TARGET_ESP32=1
monitor_speed = 115200
test_framework = unity
board_build.flash_mode = dio
board_build.f_flash = 80000000L

; ---------------------------------------------------------------------------
; Native / Emulator target (desktop build for tests and simulation)
; ---------------------------------------------------------------------------
[env:emulator]
platform = native
build_flags =
    ${common.build_flags}
    -DCONFIG_STOVEIQ_USE_EMULATOR=1
    -lm
    -lpthread
; Paths resolve relative to src_dir (firmware/src), so src files are named
; bare and the emulator tree is reached with ../. Prefixing these with src/
; silently matches nothing, and the link then fails on an undefined main().
build_src_filter =
    +<sensor.c>
    +<cooking_engine.c>
    +<tasks.c>
    +<ble_provision.c>
    +<main.c>
    +<../emulator/thermal_emulator.c>
    +<../emulator/scenarios/*.c>
; The vendored MLX90640 driver is ESP-IDF-only (driver/i2c.h). sensor.c already
; compiles it out under CONFIG_STOVEIQ_USE_EMULATOR, but PlatformIO's dependency
; finder builds everything in lib/ regardless, so it has to be ignored here.
lib_ignore = MLX90640
test_framework = unity
test_build_src = yes
